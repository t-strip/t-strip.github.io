<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — T-Strip</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#141416" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #141416;
      --text: #f0f0f2;
      --muted: #8e8e93;
      --border: rgba(255, 255, 255, 0.09);
      --accent-cyan: #67e8f9;
      --font-display: "Instrument Serif", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      color-scheme: dark;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      scrollbar-width: thin;
      scrollbar-color: rgba(103, 232, 249, 0.3) transparent;
    }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 3px; }
    .container { width: 100%; max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }
    header { border-bottom: 1px solid var(--border); }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 4rem;
      gap: 1rem;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .header-inner a:hover { color: var(--text); }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 0;
    }
    .label-mono {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-cyan);
    }
    h1 {
      margin-top: 1rem;
      font-family: var(--font-display);
      font-size: clamp(3rem, 9vw, 5.5rem);
      font-weight: 400;
      line-height: 1;
    }
    p {
      margin-top: 1.25rem;
      max-width: 34rem;
      font-size: 0.9375rem;
      line-height: 1.75;
      color: var(--muted);
    }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 2rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      padding: 0.65rem 1rem;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
    .btn-primary { background: var(--accent-cyan); border-color: var(--accent-cyan); color: #000; }
    .btn-primary:hover { background: transparent; color: var(--accent-cyan); }
    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 0;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <a href="/" aria-label="T-Strip home">T-Strip</a>
      <nav aria-label="Main navigation">
        <a href="/wiki/">Wiki</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="label-mono">Error 404</p>
    <h1>Lost on the strip.</h1>
    <p>
      The page you were looking for does not exist. It may have moved, or the link may be out of
      date. Head back to the homepage or browse the wiki to find what you need.
    </p>
    <div class="links">
      <a class="btn btn-primary" href="/">Back to home</a>
      <a class="btn" href="/wiki/">Browse the wiki</a>
    </div>
  </main>

  <footer>
    <div class="container">T-Strip — the endless terminal multiplexer</div>
  </footer>
</body>
</html>
